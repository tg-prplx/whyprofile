<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banner Framework Preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0b10;
        color: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 24px;
        padding: 24px;
      }

      h1 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }

      img {
        display: block;
        width: 100%;
        max-width: 1200px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dark</h1>
      <img src="../assets/scene-dark.svg" alt="dark profile scene">
      <h1>Light</h1>
      <img src="../assets/scene-light.svg" alt="light profile scene">
    </main>
  </body>
</html>
